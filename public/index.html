<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Arkadaşlık ve Sohbet Sitesi</title>
                <link rel="stylesheet" href="style.css">
                </head>
                <body>
                    <div class="container">
                            <!-- Giriş Ekranı -->
                                    <div id="login-screen">
                                                <h1>Arkadaş Sohbeti</h1>
                                                            <p>Sisteme bağlanmak için adını gir</p>
                                                                        <input type="text" id="username-input" placeholder="Adın veya takma adın..." autocomplete="off">
                                                                                    <button id="join-btn">Bağlan</button>
                                                                                            </div>

                                                                                                    <!-- Ana Uygulama Ekranı -->
                                                                                                            <div id="app-screen" style="display: none;">
                                                                                                                        <!-- Sol Panel -->
                                                                                                                                    <div class="sidebar">
                                                                                                                                                    <div class="user-profile">
                                                                                                                                                                        <h3 id="my-username">Adım</h3>
                                                                                                                                                                                        </div>
                                                                                                                                                                                                        
                                                                                                                                                                                                                        <div class="section-box">
                                                                                                                                                                                                                                            <h4>İstekler</h4>
                                                                                                                                                                                                                                                                <div id="requests-container"></div>
                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                <div class="section-box">
                                                                                                                                                                                                                                                                                                                    <h4>Arkadaşlarım</h4>
                                                                                                                                                                                                                                                                                                                                        <div id="friends-container"></div>
                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                        <div class="section-box">
                                                                                                                                                                                                                                                                                                                                                                                            <h4>Kullanıcılar</h4>
                                                                                                                                                                                                                                                                                                                                                                                                                <div id="all-users-container"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- Sağ Panel -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="chat-area">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="chat-header" id="chat-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span>Sohbet etmek için soldan bir arkadaş seç</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="chat-messages" id="messages-container"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="chat-input" id="chat-input-area" style="display: none;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" id="message-input" placeholder="Mesaj yaz..." autocomplete="off">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button id="send-btn">Gönder</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="/socket.io/socket.io.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
